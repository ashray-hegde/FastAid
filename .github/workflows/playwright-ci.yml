name: Playwright E2E

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend deps
        working-directory: backend
        run: |
          npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start backend
        working-directory: backend
        run: |
          nohup npm start &
          sleep 6

      - name: Seed dev admin and write token file
        working-directory: backend
        run: |
          TOKEN_FILE=$(pwd)/dev_token.json
          TOKEN_OUT=$TOKEN_FILE node tools/seedDevAdmin.js "CI Admin" ci-admin@local DevAdmin123!
          echo "WROTE $TOKEN_FILE"

      - name: Export ADMIN_TOKEN to environment
        working-directory: backend
        run: |
          TOKEN_FILE=$(pwd)/dev_token.json
          if [ -f "$TOKEN_FILE" ]; then
            ADMIN_TOKEN=$(node -e "console.log(require('$TOKEN_FILE').token)")
            echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> $GITHUB_ENV
          else
            echo "No token file found, skipping ADMIN_TOKEN export"
          fi

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start &
          sleep 6

      - name: Run Playwright tests
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:5000
          FRONTEND_URL: http://localhost:3000
          TEST_PHONE: "+911234567890"
        run: |
          npm run test:e2e -- --reporter=html

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
